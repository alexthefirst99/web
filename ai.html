<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet AlexB — Tu N (Alex) Tran</title>
<meta name="description" content="Ask an AI about Alex Tran's research, projects, skills and experience.">
<meta name="theme-color" content="#0b0608">
<link rel="icon" type="image/svg+xml" href="assets/media/favicon.svg?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --g2: #C9A46A; --g3: #a3243b; --g4: #7a1230; --pink: #c2385a; --acc: #E2C08D; --pad: clamp(14px, 3vw, 32px); }
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #0b0608; color: #fff; font-family: 'Outfit', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100dvh; border: 0; display: block; }

  /* Loader */
  #loader { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; overflow: hidden; background: #0b0608; transition: opacity .7s cubic-bezier(.4,0,.2,1), visibility 0s .7s; }
  #loader.done { opacity: 0; visibility: hidden; }
  .blob { position: absolute; aspect-ratio: 1; border-radius: 50%; filter: blur(60px); mix-blend-mode: screen; animation: drift 9s ease-in-out infinite alternate; }
  .blob.a { width: 60vmax; left: -20vmax; top: -15vmax; background: radial-gradient(circle, var(--g4), transparent 62%); opacity: .7; }
  .blob.b { width: 50vmax; right: -18vmax; bottom: -15vmax; background: radial-gradient(circle, var(--pink), transparent 62%); opacity: .45; animation-delay: -3s; }
  .blob.c { width: 40vmax; left: 30%; top: 40%; background: radial-gradient(circle, var(--g2), transparent 62%); opacity: .22; animation-delay: -6s; }
  @keyframes drift { to { transform: translate3d(5vmax, 3vmax, 0) scale(1.08); } }
  .grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 40px 48px; border-radius: 48px;
    background: rgba(18, 8, 12, .5); -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 60px 120px rgba(0,0,0,.6), inset 0 2px 1px rgba(255,255,255,.35), inset 0 -2px 1px rgba(255,255,255,.2); }
  .mark { font-family: 'Doto', monospace; font-weight: 800; font-size: clamp(72px, 14vw, 120px); line-height: .85; text-shadow: 0 0 40px rgba(255,255,255,.35); }
  .badge { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 15px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px var(--acc); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .bar { width: 180px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--acc); box-shadow: 0 0 12px var(--acc); animation: slide 1.4s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .slow { font-size: 13px; color: rgba(255,255,255,.6); opacity: 0; transition: opacity .5s; text-align: center; }
  .slow.on { opacity: 1; }
  .slow a { color: var(--acc); }
  @media (prefers-reduced-motion: reduce) { .blob, .pulse, .bar i { animation: none; } }
</style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
    <div class="grain"></div>
    <div class="card">
      <div class="mark" aria-hidden="true">AT</div>
      <div class="badge"><span class="pulse"></span>Waking up AlexB…</div>
      <div class="bar" aria-hidden="true"><i></i></div>
      <div class="slow" id="slow">Taking a while? <a href="https://meet-alex-ai.vercel.app/" target="_blank" rel="noopener">Open it directly</a> · <a href="index.html">Back to portfolio</a></div>
    </div>
  </div>

  <iframe id="app" src="about:blank" allow="autoplay; encrypted-media; speaker" title="Meet AlexB"></iframe>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      // Tell the app where its "Portfolio" button should go (this site's index page).
      var portfolio = new URL('index.html', location.href).href;
      document.getElementById('app').src = 'https://meet-alex-ai.vercel.app/?from=' + encodeURIComponent(portfolio);
      var done = false;
      function hide() {
        if (done) return; done = true;
        setTimeout(function () { loader.classList.add('done'); }, 300);
      }
      document.getElementById('app').addEventListener('load', function () {
        if (this.src !== 'about:blank') hide();
      });
      setTimeout(function () { document.getElementById('slow').classList.add('on'); }, 8000);
      setTimeout(hide, 20000); // never trap the visitor behind the loader
    })();
  </script>
</body>
</html>
